<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleStreet - Online Clothing Store</title>
  <!-- linking the css file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <h1 class="logo">StyleStreet</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Shop</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="cart-btn">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <!-- ===== HERO SECTION ===== -->
  <section class="hero" id="home">
    <div class="hero-text">
      <h2>Dress Like Your Favourite Star</h2>
      <p>Celebrity inspired clothes at student friendly prices.</p>
      <a href="#products" class="shop-btn">Shop Now</a>
    </div>
    <!-- ADD IMAGE HERE: put a banner photo in images folder and name it hero.jpg -->
    <img src="hero.jpg" alt="Hero banner" class="hero-img">
  </section>

  <!-- ===== PRODUCTS ===== -->
  <section id="products">
    <h2 class="section-title">Our Collection</h2>

    <!-- filter buttons -->
    <div class="filters">
      <button class="filter-btn active" data-cat="all">All</button>
      <button class="filter-btn" data-cat="men">Men</button>
      <button class="filter-btn" data-cat="women">Women</button>
    </div>

    <!-- products are added here by script.js -->
    <div class="product-grid" id="product-grid"></div>
  </section>

  <!-- ===== CART PANEL (hidden at start) ===== -->
  <aside id="cart-panel" class="cart-panel">
    <div class="cart-top">
      <h3>Your Cart</h3>
      <button id="close-cart">X</button>
    </div>
    <div id="cart-items"></div>
    <h3 class="total">Total: Rs. <span id="cart-total">0</span></h3>
    <button id="checkout-btn">Checkout</button>
  </aside>

  <!-- ===== FOOTER ===== -->
  <footer id="contact">
    <p>Mini Project - Online Clothing Store</p>
    <p>Email: stylestreet@example.com | Phone: 98765 43210</p>
  </footer>

  <!-- ===== TOAST MESSAGE (shows when item is added) ===== -->
  <div id="toast" class="toast">
    <img id="toast-img" src="" alt="">
    <div>
      <h4>Added to cart!</h4>
      <p id="toast-text"></p>
    </div>
  </div>

  <!-- linking the javascript file (at the end so the page loads first) -->
  <script src="script.js"></script>
</body>

</html>
